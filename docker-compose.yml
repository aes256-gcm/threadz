services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: Threadline
      APP_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: threadline
      DB_USER: threadline
      DB_PASSWORD: threadline
      PORT: "8080"
      MAX_UPLOAD_MB: 5
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: threadline
      POSTGRES_USER: threadline
      POSTGRES_PASSWORD: threadline
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadline -d threadline"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

